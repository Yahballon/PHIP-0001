<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="190" viewBox="0 0 1100 190" role="img" aria-labelledby="title desc"><title id="title">Four-stage PHIP registry workflow</title><desc id="desc">Choose, submit, validate and publish.</desc><rect width="1100" height="190" rx="16" fill="#080e24"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><rect x="18" y="28" width="235" height="132" rx="15" fill="#0b2847" stroke="#2ba8ff" stroke-width="2"/><rect x="294" y="28" width="235" height="132" rx="15" fill="#1a1a48" stroke="#a379ff" stroke-width="2"/><rect x="570" y="28" width="235" height="132" rx="15" fill="#082f3d" stroke="#30dfd2" stroke-width="2"/><rect x="846" y="28" width="235" height="132" rx="15" fill="#382116" stroke="#f3ab56" stroke-width="2"/><g fill="#ecf7ff" font-size="26" font-weight="700"><text x="135" y="85">1. CHOOSE</text><text x="412" y="85">2. SUBMIT</text><text x="686" y="85">3. VALIDATE</text><text x="964" y="85">4. PUBLISH</text></g><g fill="#b6c9ea" font-size="16"><text x="135" y="117">Check existing IDs</text><text x="412" y="117">Open a pull request</text><text x="686" y="117">CI + human review</text><text x="964" y="117">Shared JSON index</text></g></g><g fill="none" stroke="#98d9fc" stroke-width="3"><path d="m267 85 12 10-12 10"/><path d="m542 85 12 10-12 10"/><path d="m819 85 12 10-12 10"/></g></svg>
name: Validate PHIP registry
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python version
        run: python --version
      - name: Validate all records
        run: python tools/validate_registry.py
      - name: Check PR author and immutable registrations
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: python tools/validate_registry.py --actor "$PR_AUTHOR" --base origin/main
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check generated indexes
        run: |
          python tools/build_index.py
          git diff --exit-code -- index/registry.json index/stats.json REGISTRY.md
